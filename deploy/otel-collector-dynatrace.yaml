# OpenTelemetry Collector — Dynatrace stays primary, Edgemetry is the second line.
#
# Problem this solves: Dynatrace Managed can tell you a service is slow, but its
# classic UI cannot aggregate spans by callee address. This config exports every
# span twice — once to Dynatrace exactly as before, once to Edgemetry, which keeps
# the peer attributes and answers "the call to payments.internal:8443 is 900 ms
# at p95".
#
# Deploy: drop in place of the existing collector config, set the two secrets,
# restart the collector. Nothing in the application changes.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

  # Copy the callee address onto the span so both backends can group by it.
  # Different SDKs name this differently; normalise before export.
  transform/peer:
    trace_statements:
      - context: span
        statements:
          - set(attributes["edgemetry.peer"], attributes["server.address"]) where attributes["server.address"] != nil
          - set(attributes["edgemetry.peer"], attributes["peer.service"]) where attributes["edgemetry.peer"] == nil and attributes["peer.service"] != nil
          - set(attributes["edgemetry.peer"], attributes["net.peer.name"]) where attributes["edgemetry.peer"] == nil and attributes["net.peer.name"] != nil

  # Client spans only need their timing and target downstream; drop the payload.
  attributes/strip:
    actions:
      - key: http.request.body
        action: delete
      - key: db.statement
        action: delete

exporters:
  # Existing Dynatrace path — unchanged, keeps its own sampling and billing.
  otlphttp/dynatrace:
    endpoint: ${env:DT_ENDPOINT}
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

  # Edgemetry accepts native protobuf; no JSON encoder needed.
  otlphttp/edgemetry:
    traces_endpoint: ${env:EDGEMETRY_ENDPOINT}
    encoding: proto
    headers:
      Authorization: "Bearer ${env:EDGEMETRY_TOKEN}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/peer, attributes/strip, batch]
      exporters: [otlphttp/dynatrace, otlphttp/edgemetry]

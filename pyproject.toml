[project]
name = "spanlens"
version = "0.2.0"
description = "Span-level latency store for OpenTelemetry traces"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
otlp = ["opentelemetry-proto>=1.20"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "opentelemetry-proto>=1.20", "psycopg[binary]>=3.1"]

[project.scripts]
spanlens = "spanlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgemetry"
version = "0.3.0"
description = "Span-level latency store for OpenTelemetry traces"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ilker Halil Turer" }]
keywords = ["opentelemetry", "tracing", "observability", "latency", "apm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
otlp = ["opentelemetry-proto>=1.20"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "opentelemetry-proto>=1.20",
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/ilkerhalil/edgemetry"
Issues = "https://github.com/ilkerhalil/edgemetry/issues"

[project.scripts]
edgemetry = "edgemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edgemetry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a live service"]

[tool.coverage.run]
source = ["edgemetry"]
omit = ["*/edgemetry/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
